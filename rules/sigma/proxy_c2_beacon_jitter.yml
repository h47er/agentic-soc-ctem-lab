title: C2 Beaconing — Regular Interval with Jitter on Anomalous egress
id: 4f8a2d19-6c05-4b7e-9a33-d8e1f0c7b244
status: testing
description: >
  Detects outbound connections with beacon-like periodicity (uniform intervals with
  small jitter) to domains with low reputation or no prior history — ransomware
  family C2 and post-exploitation frameworks.
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: h47er (detection engineering lab)
date: 2026/09/15
tags:
  - attack.t1071.001
  - attack.command_and_control
  - attack.ta0011
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    DestinationIsIpv4: 'true'
  periodicity:
    IntervalStdev|lt: 8
    IntervalMean|gte: 30
    IntervalMean|lte: 400
    ConnectionCount|gte: 12
  reputation:
    DomainNewlyRegistered|gte: 14   # days
    DomainReputationScore|lt: 30
  condition: selection and periodicity and reputation
falsepositives:
  - Update checkers with fixed polling (allowlist vendor update domains)
level: high
